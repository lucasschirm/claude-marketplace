name: Plugin version bump

# A merge to the default branch (or dev) that changed files under plugins/<name>/ bumps that
# plugin's minor version in both manifest layouts, so installed plugin caches re-fetch. The
# bump commit itself touches only the manifests, which the bump script filters out - the
# workflow's own push is a no-op and the loop ends there.
on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    # A branch push (before = the zero sha) has no base to diff against, and a branch deletion
    # (after = the zero sha) has no tree to check out - neither can bump anything.
    if: github.event.before != '0000000000000000000000000000000000000000' && github.event.after != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bump the minor version of every plugin this push changed
        run: node scripts/bump-plugin-versions.mjs '${{ github.event.before }}' '${{ github.event.after }}'

      - name: Commit and push the bump
        # The github context reaches the shell as env vars, not as `${{ }}` inside the script: the
        # interpolation is then one line per value, and the body below stays a script that runs.
        env:
          BRANCH: ${{ github.ref_name }}
          TRIGGERED_SHA: ${{ github.sha }}
        # Two shapes this step has to survive, both learned the hard way:
        #   - `git -c` takes ONE argument (`key=value`); the space-separated form hands git the VALUE as
        #     its subcommand - "git: 'github-actions[bot]' is not a git command", which is what this step
        #     did the first time a push actually carried a plugin change. Repo-local `git config` also
        #     covers the rebase below, which needs an identity to rewrite the commit with.
        #   - checkout of a push event leaves HEAD detached, where a bare `git push` refuses ("You are
        #     not currently on a branch"), so the push names its destination.
        # test/test-bump-plugin-versions.ts extracts and runs this body against a local origin, detached
        # and with no git identity, so both of those failures come back as a red suite.
        run: |
          if git diff --quiet; then
            echo "No version bumps to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(plugins): bump versions after ${TRIGGERED_SHA}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; the ref moved - rebasing onto it and retrying."
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
          done
          echo "The push kept losing the race; giving up (the next push to the branch retries the bump)."
          exit 1
