name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR/branch: a new push cancels the run before it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # The gate that made 34 type errors possible to land: strict tsc over extensions/ plus the
  # manifests. It runs first so a broken type fails before the slower Pi-runtime matrix.
  quality:
    name: Quality gates (typecheck, manifests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck extensions/
        run: npm run typecheck

      - name: Validate marketplace / plugin / Pi manifests
        run: npm run validate

  # Fast checks that need nothing but Node: JSON manifests and the standalone
  # node:test suites (Node >= 23.6 runs TypeScript directly).
  manifests-and-unit-tests:
    name: Manifests & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate marketplace / plugin / Pi manifests
        run: node scripts/validate-marketplace.mjs

      - name: Run unit tests
        run: npm run test:unit

  # Extension suites that run inside the Pi runtime. They use mock `gh`/Pi APIs
  # and `--offline`, so no model credentials are needed.
  # Excluded on purpose: test-devin-delegate(.ts|-lifecycle.ts) start real Devin
  # sessions, and test-orca-orchestration.sh needs a live Orca backend.
  pi-extension-tests:
    name: Pi extension tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - observe-pr
          - branch-observer
          - startup-notice
          - observe-pr-resume
          - pr-tasks
          - tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@^1.3.0

      - name: Run ${{ matrix.suite }} suite
        run: bash test/run.sh '${{ matrix.suite }}'
