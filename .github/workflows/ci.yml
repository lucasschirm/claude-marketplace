name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR/branch: a new push cancels the run before it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The cutover: the first commit .githooks/commit-msg stamped. Commits that are not descendants of it
# were made before the hooks existed and are exempt, so a branch already in flight when they landed is
# not failed retroactively. Drop it once no such branch is open.
env:
  QUALITY_GATE_CUTOVER: 810de21a53bf7473e5f214862d9ebc86718c0dd6

jobs:
  # Was every commit on this branch made with the gate running? A pre-commit hook is a local file:
  # --no-verify, QA_SKIP_HOOKS=1 and "never ran npm install" all bypass it with nothing to show at the
  # time, and the commit left behind is the only evidence. This job is seconds and needs no install, so
  # a bypass is the first thing the run reports - see scripts/check-commit-hygiene.mjs for what counts.
  commit-hygiene:
    name: Every commit went through the gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 - the base commit and every patch in between have to be in the checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # github.sha on a pull_request is the test-merge commit, whose parents are the base and the PR
      # head: base..github.sha is exactly the pull request's own commits, and merges are exempt anyway.
      - name: Check the commits this pull request adds
        if: github.event_name == 'pull_request'
        run: >
          node scripts/check-commit-hygiene.mjs
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.sha }}
          --cutover ${{ env.QUALITY_GATE_CUTOVER }}

      - name: Check the commits this push adds
        if: github.event_name == 'push'
        run: >
          node scripts/check-commit-hygiene.mjs
          --base ${{ github.event.before }}
          --head ${{ github.sha }}
          --cutover ${{ env.QUALITY_GATE_CUTOVER }}

      - name: Check this branch against main
        if: github.event_name == 'workflow_dispatch'
        run: >
          node scripts/check-commit-hygiene.mjs
          --base origin/main
          --head ${{ github.sha }}
          --cutover ${{ env.QUALITY_GATE_CUTOVER }}

  # The gate that made 34 type errors possible to land, now covering the whole cheap surface: strict
  # tsc, biome lint, formatting stability, the repo invariants and the quality ratchet, and the
  # manifests. The slower jobs wait for it, so a defect stops the run in ~1 minute instead of after the
  # whole Pi-runtime matrix.
  quality:
    name: Quality gates (typecheck, lint, format, invariants, manifests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # By that exact name, and nothing else from it spelled out here: `npm run qa:static` is what
      # .githooks/pre-commit runs, so CI and the hook cannot drift into gating different things.
      # It is typecheck, lint, format:check, check and validate - npm names the one that failed.
      - name: The same static gate the pre-commit hook runs (npm run qa:static)
        run: npm run qa:static

      - name: The invariants are proven to bite (fixtures against a copy of the tree)
        run: bash test/run.sh quality-fixtures

  # Standalone node:test suites (Node >= 23.6 runs TypeScript directly) plus the manifests.
  manifests-and-unit-tests:
    name: Manifests & unit tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # npm run test:unit delegates to test/run.sh, which is also where the suite list lives.
      - run: npm ci

      - name: Validate marketplace / plugin / Pi manifests
        run: npm run validate

      - name: Run unit tests
        run: npm run test:unit

  # The agy-acp package's suites: plain `node --test` over Node built-ins - no Pi, no model calls.
  agy-acp:
    name: agy-acp tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Run agy-acp suite
        run: bash test/run.sh agy-acp

  # Extension suites that run inside the Pi runtime. They use mock `gh`/Pi APIs
  # and `--offline`, so no model credentials are needed.
  # Excluded on purpose: test-delegate-live(.ts|-lifecycle.ts) start real Devin
  # sessions, and test-orca-orchestration.sh needs a live Orca backend.
  pi-extension-tests:
    name: Pi extension tests (${{ matrix.suite }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - observe-pr
          - observe-pr-gh-failure
          - observe-pr-mergeability
          - observe-pr-branch-scan
          - branch-observer
          - startup-notice
          - observe-pr-resume
          - observe-pr-stale
          - compaction-recovery
          - pr-tasks
          - pr-tasks-stale
          - pr-tasks-gh-failure
          - pr-tasks-reconcile
          - tools
          - delegate-queue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@^1.3.0

      - name: Run ${{ matrix.suite }} suite
        run: bash test/run.sh '${{ matrix.suite }}'
